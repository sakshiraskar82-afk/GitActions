name: Daily Cron Job - 8 AM

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Daily 8 AM job has started."

      - name: Display Current Date and Time
        run: date

      - name: Job Completed
        run: echo "Daily 8 AM job completed successfully."
